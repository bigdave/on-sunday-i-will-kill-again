[package]
name = "on-sunday-i-will-kill-again"
version = "0.3.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "A headless Quake II protocol 34 player connection for independent Rust bots"
readme = "README.md"
repository = "https://github.com/bigdave/on-sunday-i-will-kill-again"
keywords = ["quake2", "ctf", "bots", "protocol", "client"]
categories = ["game-development", "network-programming"]
exclude = ["validation", "*.pak", "*.bsp", "*.nav", "*.nav2"]

[profile.release]
opt-level = 2
